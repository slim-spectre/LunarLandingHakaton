[project]
name = "lunar-navigator-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<0.122",
  "starlette>=0.49.1,<0.50",
  "uvicorn>=0.34,<0.35",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2.3,<3.3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<0.29",
  "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.9,<0.10",
  "openapi-spec-validator>=0.7.2,<0.8",
  "jsonschema[format]>=4.23,<5",
  "pyyaml>=6.0.2,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --timeout=15"
markers = ["integration: requires a running PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
