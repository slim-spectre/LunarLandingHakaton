openapi: 3.1.0
info:
  title: Lunar Landing Site Navigator API v1
  version: 1.0.0
  description: Agreed API v1 contract. Only GET /api/v1/health is implemented in Stage
    0. Planned operations are explicitly marked. Every example is a synthetic development/test
    fixture, not a measured NASA result. See docs/API_V1.md for scientific, temporal
    and scoring rules and docs/CONTRACT_DECISIONS.md for explicit schema decisions.
    Cross-field x-invariants require application validation; JSON Schema alone does
    not enforce them.
