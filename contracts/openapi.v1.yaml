      operationId: getHealth
      summary: getHealth
      x-implementation-status: implemented
      parameters: []
      responses:
        '400':
          description: 'INVALID_REQUEST: malformed structure, missing required fields
            or unknown fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              description: Server-generated UUID matching error.request_id.
              schema:
                type: string
                format: uuid
        '404':
